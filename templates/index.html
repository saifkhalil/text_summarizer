<!doctype html>
<html lang="{{ 'ar' if ui_lang=='ar' else 'en' }}" dir="{{ 'rtl' if ui_lang=='ar' else 'ltr' }}">
<head>
  <meta charset="utf-8" />
  <title>{{ t("app_title") }}</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body class="bg-light">
  <div class="container py-5">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h3 class="mb-0">{{ t("app_title") }}</h3>

      <div class="d-flex gap-2">
        <a class="btn btn-outline-secondary btn-sm" href="/set-lang?ui_lang=en">English UI</a>
        <a class="btn btn-outline-secondary btn-sm" href="/set-lang?ui_lang=ar">واجهة عربي</a>
      </div>
    </div>

    <div class="card shadow-sm">
      <div class="card-body">
        <form action="/summarize" method="post" enctype="multipart/form-data">
          <input type="hidden" name="ui_lang" value="{{ ui_lang }}"/>

          <div class="row g-3">
            <div class="col-md-6">
              <label class="form-label">{{ t("content_lang") }}</label>
              <select class="form-select" name="content_lang">
                <option value="auto" selected>{{ t("auto") }}</option>
                <option value="ar">{{ t("arabic") }}</option>
                <option value="en">{{ t("english") }}</option>
              </select>
            </div>

            <div class="col-md-6">
              <label class="form-label">{{ t("summary_length") }}</label>
              <select class="form-select" name="length">
                <option value="short">{{ t("short") }}</option>
                <option value="medium" selected>{{ t("medium") }}</option>
                <option value="long">{{ t("long") }}</option>
              </select>
            </div>
          </div>

          <hr class="my-4"/>

          <div class="mb-3">
            <label class="form-label">{{ t("write_text") }}</label>
            <textarea class="form-control" name="input_text" rows="7" placeholder="{{ t('write_text_ph') }}"></textarea>
          </div>

          <div class="mb-3">
            <label class="form-label">{{ t("or_upload") }}</label>
            <input class="form-control" type="file" name="file" accept=".pdf,.docx">
          </div>

          <button class="btn btn-primary">{{ t("summarize") }}</button>
        </form>

        <p class="text-muted mt-3 mb-0" style="font-size: 0.9rem;">
          {{ t("hint") }}
        </p>
      </div>
    </div>
  </div>
</body>
</html>
