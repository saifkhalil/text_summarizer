<!doctype html>
<html lang="{{ 'ar' if ui_lang=='ar' else 'en' }}" dir="{{ 'rtl' if ui_lang=='ar' else 'ltr' }}">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{{ t("app_title") }}</title>

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Cairo:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css">
</head>

<body>
  <div id="loadingOverlay" class="loading-overlay" style="display: none !important;">
    <div class="spinner-container"></div>
    <div class="loading-text">{{ t("loading") }}</div>
  </div>

  <div class="container py-5">
    <div class="d-flex align-items-center justify-content-between mb-4">
      <div class="d-flex align-items-center gap-3">
        <div class="brand-dot"></div>
        <div>
          <div class="h5 mb-0">{{ t("app_title") }}</div>
        </div>
      </div>

      <div class="d-flex align-items-center gap-2">
        <button id="themeToggle" type="button" class="btn btn-ghost btn-sm"
                onclick="window.__toggleTheme && window.__toggleTheme()" aria-pressed="false" title="Theme">
          🌙
        </button>
        <a class="btn btn-ghost btn-sm" href="/?ui_lang={{ 'en' if ui_lang == 'ar' else 'ar' }}">
          {{ 'English' if ui_lang == 'ar' else 'العربية' }}
        </a>
      </div>
    </div>

    <div class="row g-4">
      <div class="col-lg-12">
        <div class="card glass-card shadow-sm">
          <div class="card-body p-4">
            <form action="/summarize" method="post" enctype="multipart/form-data">
              <input type="hidden" name="ui_lang" value="{{ ui_lang }}"/>

              <div class="section-title mb-2">Settings</div>
              <div class="row g-3 mb-3">
                <div class="col-md-6">
                  <label class="form-label label-muted">{{ t("engine") }}</label>
                  <select class="form-select form-select-modern" name="engine" id="engineSelect">
                    <option value="ollama_local" selected>{{ t("engine_ollama_local") }}</option>
                    <option value="ollama_cloud">{{ t("engine_ollama_cloud") }}</option>
                    <option value="extractive">{{ t("engine_extractive") }}</option>
                  </select>
                </div>

                <div class="col-md-6">
                  <label class="form-label label-muted">{{ t("content_lang") }}</label>
                  <select class="form-select form-select-modern" name="content_lang">
                    <option value="auto" selected>{{ t("auto") }}</option>
                    <option value="ar">{{ t("arabic") }}</option>
                    <option value="en">{{ t("english") }}</option>
                  </select>
                </div>

                <div class="col-md-6">
                  <label class="form-label label-muted">{{ t("summary_length") }}</label>
                  <select class="form-select form-select-modern" name="length">
                    <option value="short">{{ t("short") }}</option>
                    <option value="medium" selected>{{ t("medium") }}</option>
                    <option value="long">{{ t("long") }}</option>
                  </select>
                </div>

                <div class="col-md-6">
                  <label class="form-label label-muted">{{ t("style") }}</label>
                  <select class="form-select form-select-modern" name="style">
                    <option value="both" selected>{{ t("style_both") }}</option>
                    <option value="paragraph">{{ t("style_paragraph") }}</option>
                    <option value="bullets">{{ t("style_bullets") }}</option>
                  </select>
                </div>
              </div>

              <div class="row g-3 mb-4">
                <div class="col-md-6" id="ollamaUrlGroup">
                  <label class="form-label label-muted">{{ t("ollama_url") }}</label>
                  <input class="form-control form-control-modern" name="ollama_url" id="ollamaUrl" value="http://localhost:11434"/>
                </div>
                <div class="col-md-6" id="ollamaModelGroup">
                  <label class="form-label label-muted">{{ t("ollama_model") }}</label>
                  <input class="form-control form-control-modern" name="model" id="ollamaModel" value="qwen2.5:3b-instruct"/>
                  <select class="form-select form-select-modern" id="ollamaModelList" style="display:none;"></select>
                </div>
                <div class="col-12">
                  <div class="note">
                    {{ t("ollama_note") }}
                    <div id="ollamaModelHint" class="small text-muted mt-1">
                      Recommended: <code>qwen2.5:7b-instruct</code> · Fast: <code>qwen2.5:3b-instruct</code>
                    </div>
                  </div>
                </div>
              </div>

              <div class="section-title mb-2">{{ t("write_text") }}</div>
              <div class="mb-3">
                <textarea class="form-control textarea-modern" name="input_text" rows="7"
                          placeholder="{{ t('write_text_ph') }}"></textarea>
              </div>

              <div id="formErrorHost"></div>

              <div class="d-flex align-items-center justify-content-between gap-3">
                <button class="btn btn-primary btn-modern px-4" type="submit">
                  {{ t("summarize") }}
                </button>
              </div>
            </form>
          </div>
        </div>
      </div>

    </div>
  </div>

  <script>
(function(){
  function setVisible(el, visible){
    if(!el) return;
    el.style.display = visible ? "block" : "none";
  }

  function updateOllamaForm(){
    const engine = document.getElementById("engineSelect")?.value || "ollama_local";

    const url = document.getElementById("ollamaUrl");
    const modelInput = document.getElementById("ollamaModel");
    const modelList = document.getElementById("ollamaModelList");

    const hint = document.getElementById("ollamaModelHint");

    const isOllama = (engine === "ollama_local" || engine === "ollama_cloud");
    const isCloud  = (engine === "ollama_cloud");

    if(hint){
      if(isCloud){
        hint.innerHTML = 'Recommended: <code>gpt-oss:120b</code> · Fast: <code>gpt-oss:20b</code>';
      } else {
        hint.innerHTML = 'Recommended: <code>qwen2.5:7b-instruct</code> · Fast: <code>qwen2.5:3b-instruct</code>';
      }
    }

    if(url){
      url.disabled = !isOllama;
      if(isCloud){
        url.value = "https://ollama.com/";
        url.readOnly = true;
      } else {
        url.readOnly = false;
        if(url.value === "https://ollama.com/") {
          url.value = "http://localhost:11434";
        }
      }
      url.placeholder = isCloud ? "{{ t('ollama_url_cloud_ph') }}" : "{{ t('ollama_url_local_ph') }}";
    }

    if(modelInput && modelList){
      modelInput.disabled = !isOllama;
      if(isCloud){
        modelInput.style.display = "none";
        modelInput.name = ""; // Remove name so it's not submitted
        modelList.style.display = "block";
        modelList.name = "model"; // Give name to the select
        modelList.disabled = false;
        fetchCloudModels();
      } else {
        modelInput.style.display = "block";
        modelInput.name = "model";
        modelList.style.display = "none";
        modelList.name = "";
        modelList.disabled = true;
      }
    }
  }

  async function fetchCloudModels(){
    const modelList = document.getElementById("ollamaModelList");
    if(!modelList) return;

    // Only fetch if it's empty or only has the loading/fallback message
    if (modelList.options.length > 1 && modelList.value !== "") return;

    modelList.innerHTML = '<option value="">Loading models...</option>';
    try {
      const resp = await fetch("/api/models");
      const data = await resp.json();
      if(data && data.models){
        modelList.innerHTML = "";
        data.models.forEach(m => {
          const opt = document.createElement("option");
          opt.value = m.name;
          opt.textContent = m.name;
          if(m.name === "gpt-oss:20b") opt.selected = true;
          modelList.appendChild(opt);
        });
      }
    } catch(e) {
      console.error("Failed to fetch models", e);
      modelList.innerHTML = '<option value="gpt-oss:120b">gpt-oss:120b</option>';
    }
  }

  function showFormError(msg){
    const host = document.getElementById("formErrorHost");
    if(!host) return alert(msg);
    host.innerHTML = '<div class="alert mt-3"><div class="fw-semibold">'+msg+'</div></div>';
  }

  function validateBeforeSubmit(ev){
    const engine = document.getElementById("engineSelect")?.value || "ollama_local";
    
    // Check if cloud mode requirements are met
    if(engine === "ollama_cloud") {
      const url = (document.getElementById("ollamaUrl")?.value || "").trim();
      let model = (document.getElementById("ollamaModelList")?.value || "").trim();

      if(!url || !model){
        ev.preventDefault();
        showFormError("{{ t('err_cloud_requires_url_model') }}");
        return false;
      }
    }

    // If validation passes, show loading overlay
    const overlay = document.getElementById("loadingOverlay");
    if (overlay) {
      overlay.setAttribute("style", "display: flex !important;");
    }
    
    return true;
  }

  document.addEventListener("DOMContentLoaded", function(){
    const sel = document.getElementById("engineSelect");
    const form = document.querySelector("form[action='/summarize']");

    if(sel) sel.addEventListener("change", updateOllamaForm);
    if(form) form.addEventListener("submit", validateBeforeSubmit);

    updateOllamaForm();
  });
})();
</script>
<script src="/static/theme.js"></script>
</body>
</html>
