<!doctype html>
<html lang="{{ 'ar' if ui_lang=='ar' else 'en' }}" dir="{{ 'rtl' if ui_lang=='ar' else 'ltr' }}">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{{ t("app_title") }}</title>

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Cairo:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css">
</head>

<body>
  <div id="loadingOverlay" class="loading-overlay" style="display: none !important;">
    <div class="spinner-container"></div>
    <div class="loading-text">{{ t("loading") }}</div>
  </div>

  <div class="container py-5">
    <div class="d-flex align-items-center justify-content-between mb-4">
      <div class="d-flex align-items-center gap-3">
        <div class="brand-dot"></div>
        <div>
          <div class="h5 mb-0">{{ t("app_title") }}</div>
        </div>
      </div>

      <div class="d-flex align-items-center gap-2">
        <button id="themeToggle" type="button" class="btn btn-ghost btn-sm"
                onclick="window.__toggleTheme && window.__toggleTheme()" aria-pressed="false" title="Theme">
          🌙
        </button>
        <a class="btn btn-ghost btn-sm" href="/?ui_lang={{ 'en' if ui_lang == 'ar' else 'ar' }}">
          {{ 'English' if ui_lang == 'ar' else 'العربية' }}
        </a>
      </div>
    </div>

    <div class="row g-4">
      <div class="col-lg-12">
        <div class="card glass-card shadow-sm">
          <div class="card-body p-4">
            <form action="/summarize" method="post" enctype="multipart/form-data">
              <input type="hidden" name="ui_lang" value="{{ ui_lang }}"/>

              <div class="section-title mb-2">Settings</div>
              <div class="row g-3 mb-3">
                <div class="col-md-6">
                  <label class="form-label label-muted">{{ t("summary_length") }}</label>
                  <select class="form-select form-select-modern" name="length">
                    <option value="short">{{ t("short") }}</option>
                    <option value="medium" selected>{{ t("medium") }}</option>
                    <option value="long">{{ t("long") }}</option>
                  </select>
                </div>

                <div class="col-md-6">
                  <label class="form-label label-muted">{{ t("style") }}</label>
                  <select class="form-select form-select-modern" name="style">
                    <option value="both" selected>{{ t("style_both") }}</option>
                    <option value="paragraph">{{ t("style_paragraph") }}</option>
                    <option value="bullets">{{ t("style_bullets") }}</option>
                  </select>
                </div>
              </div>

              <div class="section-title mb-2">{{ t("upload_file") }}</div>
              <div class="mb-3">
                <input type="file" class="form-control form-control-modern" name="file" accept=".pdf,.docx"/>
                <div class="form-text text-muted">{{ t("upload_hint") }}</div>
              </div>

              <div class="section-title mb-2">{{ t("write_text") }}</div>
              <div class="mb-3">
                <textarea class="form-control textarea-modern" name="input_text" rows="7"
                          placeholder="{{ t('write_text_ph') }}"></textarea>
              </div>

              <div id="formErrorHost"></div>

              <div class="d-flex align-items-center justify-content-between gap-3">
                <button class="btn btn-primary btn-modern px-4" type="submit">
                  {{ t("summarize") }}
                </button>
              </div>
            </form>
          </div>
        </div>
      </div>

    </div>
  </div>

  <script>
(function(){
  function showLoading(ev){
    const overlay = document.getElementById("loadingOverlay");
    if (overlay) {
      overlay.setAttribute("style", "display: flex !important;");
    }
    return true;
  }

  document.addEventListener("DOMContentLoaded", function(){
    const form = document.querySelector("form[action='/summarize']");
    if(form) form.addEventListener("submit", showLoading);
  });
})();
</script>
<script src="/static/theme.js"></script>
</body>
</html>
